name: Non-breaking npm audit fix probe

on:
  push:
    branches:
      - 'agent/finaliza-inspetor-naval'
    paths:
      - '.github/workflows/nonbreaking-audit-fix.yml'

permissions:
  contents: write

jobs:
  fix-compatible-transitives:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finaliza-inspetor-naval
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply only non-breaking audit resolutions to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts || true
      - name: Reinstall from resulting lockfile
        run: npm ci
      - name: Validate Expo compatibility
        run: |
          npx expo install --check
          npx expo-doctor
      - name: Run tests
        run: npm test
      - name: Record remaining production audit
        continue-on-error: true
        run: npm audit --omit=dev > npm-audit-after-compatible-fix.txt 2>&1
      - name: Commit compatible lockfile changes
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No compatible lockfile-only audit update available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Atualiza dependências transitivas compatíveis"
          git push origin HEAD:agent/finaliza-inspetor-naval
      - name: Upload audit probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonbreaking-audit-fix-report
          path: npm-audit-after-compatible-fix.txt
          if-no-files-found: ignore
          retention-days: 7
