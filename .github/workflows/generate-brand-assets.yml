name: Generate brand assets

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/finaliza-inspetor-naval'
    paths:
      - '.github/workflows/generate-brand-assets.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finaliza-inspetor-naval
          fetch-depth: 0
      - name: Generate PNG assets
        run: node scripts/generate-brand-assets.mjs
      - name: Remove one-off workflow
        run: rm -f .github/workflows/generate-brand-assets.yml
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets .github/workflows/generate-brand-assets.yml
          git commit -m "Adiciona ícone e splash neutros do Inspetor Naval"
          git push origin HEAD:agent/finaliza-inspetor-naval
