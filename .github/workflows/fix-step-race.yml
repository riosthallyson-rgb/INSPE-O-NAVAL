name: Apply step race fix

on:
  push:
    branches:
      - 'agent/finaliza-inspetor-naval'
    paths:
      - '.github/workflows/fix-step-race.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finaliza-inspetor-naval
          fetch-depth: 0
      - run: node scripts/fix-step-race.mjs
      - run: rm -f scripts/fix-step-race.mjs .github/workflows/fix-step-race.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Serializa salvamento antes de avançar inspeção"
          git push origin HEAD:agent/finaliza-inspetor-naval
