name: PDF normative audit

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/**'
    paths:
      - '.github/workflows/pdf-audit.yml'
      - 'scripts/audit-pdf.mjs'
      - 'scripts/extract-pdfs.mjs'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for PDF.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Hash audited PDFs
        run: sha256sum assets/docs/normam-201.pdf assets/docs/normam-204.pdf assets/docs/normam-211.pdf assets/docs/normam-301.pdf assets/docs/rlesta.pdf > pdf-sha256.txt

      - name: Inventory embedded PDFs
        run: node scripts/extract-pdfs.mjs > pdf-inventory.txt

      - name: Audit NORMAM-201
        run: node scripts/audit-pdf.mjs normam-201.pdf "colete salva-vidas" "boia circular" "extintor" "carta náutica" "radiocomunicação" > audit-normam-201.txt

      - name: Audit NORMAM-204
        run: node scripts/audit-pdf.mjs normam-204.pdf "lista de passageiros" "despacho" "documentos" "passageiros" > audit-normam-204.txt

      - name: Audit NORMAM-211
        run: node scripts/audit-pdf.mjs normam-211.pdf "colete salva-vidas" "embarcação de esporte" "habilitação" "lotação" > audit-normam-211.txt

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: normative-audit
          path: |
            pdf-sha256.txt
            pdf-inventory.txt
            audit-normam-201.txt
            audit-normam-204.txt
            audit-normam-211.txt
          retention-days: 7
