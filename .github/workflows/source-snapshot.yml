name: Source snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/**'
    paths:
      - '.github/workflows/source-snapshot.yml'

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare selected sources
        run: |
          mkdir -p snapshot/src/features/inspections snapshot/src/features/history snapshot/src/theme snapshot/app
          cp src/App.js snapshot/src/App.js
          cp src/features/inspections/AssistedInspectionScreen.js snapshot/src/features/inspections/AssistedInspectionScreen.js
          cp src/features/history/InspectionHistoryScreen.js snapshot/src/features/history/InspectionHistoryScreen.js
          cp src/theme/tokens.js snapshot/src/theme/tokens.js
          cp src/theme/styles.js snapshot/src/theme/styles.js
          cp app.json eas.json package.json README.md snapshot/
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: snapshot
          retention-days: 1
