name: Integrate data safety panel

on:
  push:
    branches:
      - 'agent/finaliza-inspetor-naval'
    paths:
      - '.github/workflows/patch-data-safety.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finaliza-inspetor-naval
          fetch-depth: 0
      - run: node scripts/patch-data-safety.mjs
      - run: rm -f scripts/patch-data-safety.mjs .github/workflows/patch-data-safety.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Exibe uso local e situação de backup"
          git push origin HEAD:agent/finaliza-inspetor-naval
