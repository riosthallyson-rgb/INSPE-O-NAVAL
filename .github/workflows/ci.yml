name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo dependency check
        run: npx expo install --check

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Tests
        run: npm test

      - name: Production audit
        run: npm audit --omit=dev

      - name: Full audit report
        if: always()
        continue-on-error: true
        run: npm audit
