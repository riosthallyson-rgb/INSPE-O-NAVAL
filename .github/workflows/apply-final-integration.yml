name: Apply final integration

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/finaliza-inspetor-naval'
    paths:
      - '.github/workflows/apply-final-integration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/finaliza-inspetor-naval
          fetch-depth: 0

      - name: Rebuild and verify patch
        shell: bash
        run: |
          cat scripts/final-integration.patch.gz.b64.part00 scripts/final-integration.patch.gz.b64.part01 scripts/final-integration.patch.gz.b64.part02 > /tmp/final-integration.patch.gz.b64
          base64 -d /tmp/final-integration.patch.gz.b64 | gzip -dc > /tmp/final-integration.patch
          git apply --check /tmp/final-integration.patch

      - name: Apply integration
        run: git apply /tmp/final-integration.patch

      - name: Remove temporary integration artifacts
        run: |
          rm -f scripts/final-integration.patch.gz.b64.part00 scripts/final-integration.patch.gz.b64.part01 scripts/final-integration.patch.gz.b64.part02
          rm -f .github/workflows/source-snapshot.yml
          rm -f .github/workflows/apply-final-integration.yml

      - name: Commit integrated flows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integra fluxos de campo, backup e busca normativa"
          git push origin HEAD:agent/finaliza-inspetor-naval
