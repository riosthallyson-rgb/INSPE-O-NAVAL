name: Apply final silent-error patch

on:
  push:
    branches:
      - 'agent/finaliza-inspetor-naval'
    paths:
      - '.github/workflows/compass-scope-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finaliza-inspetor-naval
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Make Compass simulation failure visible
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.js')
          source = path.read_text()
          old = "  const handleCompassSimulation = async (operationalState) => {\n    if (isAskingCompass) return;\n    setIsAskingCompass(true);\n    try {\n      const simulated = await askGroundedAssistant({ question, inspection: currentInspection, contextOverrides: { operationalState } });\n      setResult({ ...simulated, isSimulation: true });\n    } finally {\n      setIsAskingCompass(false);\n    }\n  };"
          new = "  const handleCompassSimulation = async (operationalState) => {\n    if (isAskingCompass) return;\n    setIsAskingCompass(true);\n    try {\n      const simulated = await askGroundedAssistant({ question, inspection: currentInspection, contextOverrides: { operationalState } });\n      setResult({ ...simulated, isSimulation: true });\n    } catch (error) {\n      Alert.alert('Bússola', error?.message || 'Não foi possível simular o cenário localmente.');\n    } finally {\n      setIsAskingCompass(false);\n    }\n  };"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected one Compass simulation block, found {count}')
          path.write_text(source.replace(old, new))
          PY
      - name: Validate diff
        run: git diff --check
      - name: Run tests
        run: npm test
      - name: Validate Expo project
        run: |
          npx expo install --check
          npx expo-doctor
      - name: Commit validated error handling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.js
          git commit -m "Exibe falha na simulação da Bússola"
          git push origin HEAD:agent/finaliza-inspetor-naval
