name: Android smoke build

# Validação nativa definitiva do código final desta entrega; mudanças neste workflow disparam build completo.
on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/finaliza-inspetor-naval'
    paths:
      - '.github/workflows/android-smoke.yml'

jobs:
  build-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build standalone release APK for smoke testing
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: inspetor-naval-release-smoke-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
      - name: Launch standalone APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am force-stop com.bizu.inspetornaval
            adb shell am start -W -n com.bizu.inspetornaval/.MainActivity
            sleep 15
            echo "Process: $(adb shell pidof com.bizu.inspetornaval)"
            test -n "$(adb shell pidof com.bizu.inspetornaval)"
            if adb logcat -d -b crash | grep -q "com.bizu.inspetornaval"; then echo "Fatal Android crash detected for Inspetor Naval"; adb logcat -d -b crash; exit 1; fi
